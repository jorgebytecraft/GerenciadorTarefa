<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="area-page">
<div id="app"></div>
    <header class="header">
        <div class="header-container">
            <div class="card card-body m-3">
                <h1 class="display-1 font-monospace text-center">To Do List</h1>
            </div>
        </div>
    </header>

    <aside class="aside">
     <div class="aside-container">
        <div class="card card-body m-3">
            <h5>Lista de Tarefas</h5>
            <ul data-js="lista-tarefas-iniciada" class="list-group list-group-flush m-3">
                                      
            </ul>
        </div>
     </div>
      
     <div class="aside-container">
        <div class="card card-body m-3">
            <h5>Lista em Andamentos</h5>
            <ul data-js="lista-tarefas-andamento" class="list-group list-group-flush m-3">
                         
            </ul>
        </div>
     </div>

      <div class="aside-container">
        <div class="card card-body m-3">
            <h5>Lista Concluida</h5>
            <ul data-js="lista-tarefas-finaliza" class="list-group list-group-numbered m-3 p-3">
                
            </ul>
        </div>
     </div>

    </aside>

    <main class="main">
        <div class="main-container">
            <div class="card card-body">
                <div class="input-group gap-5"> 
                    <input data-js="adicionar-tarefa" type="text" placeholder="Nova Tarefa" class="form-control">              
                    <button data-js="botao-tarefa-iniciada"  class="btn btn-outline-primary btn-sm">Adicionar Tarefas</button>                      
                </div>              
            </div>
        </div>

        <div class="main-container">
            <div class="card card-body">
                <div class="input-group gap-5"> 
                    <input data-js="andamento-tarefa" type="text" placeholder="Tarefa" class="form-control">
                    <button data-js="botao-tarefa-andamento" class="btn btn-outline-danger btn-sm">Adicionar Tarefas em Andamento</button>
                </div>
            </div>
        </div>

        <div class="main-container">
            <div class="card card-body">
                <div class="input-group gap-5">
                    <input data-js="finalizar-tarefa" type="text" placeholder="Tarefa Concluída" class="form-control" >
                    <button data-js="botao-tarefa-finaliza" class="btn btn-outline-success btn-sm">Adicionar Tarefas Concluídas</button>                
                </div>
            </div>
        </div>

    </main>
    
    <footer class="footer">
        <div class="footer-container">
            <div class="card card-body m-3">
                <h5> Gerenciador de Tarefas</h5>
                <p>Desenvolvido por: Jorge Borges</p>              
            </div>
        </div>
    </footer>

</body>
<script type="module" src="./src/main.ts"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
